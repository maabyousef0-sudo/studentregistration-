<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>تسجيل طالب جديد</h1>

    <hr>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="register.html">تسجيل طالب</a>
        <a href="students.html">بيانات الطلاب</a>
        <a href="contact.html">اتصل بنا</a>
    </nav>

    <hr>

    <h2>نموذج التسجيل الجامعي</h2>

    <div id="message" class="message" hidden></div>

    <form id="registerForm" action="#" method="post">

        <label for="fullname">الاسم الكامل:</label>
        <input type="text" id="fullname" name="fullname" required>

        <br><br>

        <label for="student_id">الرقم الجامعي:</label>
        <input type="text" id="student_id" name="student_id" required>

        <br><br>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="phone">رقم الهاتف:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label>الجنس:</label>
        <input type="radio" name="gender" value="male"> ذكر
        <input type="radio" name="gender" value="female"> أنثى

        <br><br>

        <label for="college">الكلية:</label>
        <select id="college" name="college" required>
            <option value="">اختاري الكلية</option>
            <option value="computer">علوم الحاسوب</option>
            <option value="science">العلوم</option>
            <option value="economics">الاقتصاد</option>
            <option value="engineering">الهندسة</option>
            <option value="medicine">الطب</option>
        </select>

        <br><br>

        <label for="specialization">التخصص:</label>
        <input type="text" id="specialization" name="specialization" required>

        <br><br>

        <label for="level">المستوى الدراسي:</label>
        <select id="level" name="level">
            <option value="">اختاري المستوى</option>
            <option value="1">المستوى الأول</option>
            <option value="2">المستوى الثاني</option>
            <option value="3">المستوى الثالث</option>
            <option value="4">المستوى الرابع</option>
            <option value="5">المستوى الخامس</option>
        </select>

        <br><br>

        <label for="birthdate">تاريخ الميلاد:</label>
        <input type="date" id="birthdate" name="birthdate">

        <br><br>

        <input type="submit" value="إرسال التسجيل">
        <input type="reset" value="مسح البيانات">

    </form>

    <hr>

    <p>
        <a href="students.html">عرض بيانات الطلاب</a>
    </p>

    <p>
        <a href="index.html">العودة إلى الصفحة الرئيسية</a>
    </p>

    <script src="script.js"></script>
</body>
</html>
